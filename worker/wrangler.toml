name = "pickup-notification-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Supabase無料プランの自動停止を防ぐため、毎日 3:00（日本時間）にDBへ軽い問い合わせをする（src/index.ts の scheduled）
# cron はUTCで指定するため、18:00 UTC = 翌 3:00 JST
[triggers]
crons = ["0 18 * * *"]

# Cloudflareダッシュボードで設定済みの環境変数（secretsとして管理）
# wrangler secret put SUPABASE_URL
# wrangler secret put SUPABASE_API_KEY
# wrangler secret put LINE_TOKEN
# wrangler secret put LINE_CHANNEL_SECRET
# wrangler secret put LINE_LIFF_ID
# wrangler secret put LINE_CHANNEL_ID
# wrangler secret put LINE_LINK_LIFF_ID      （ご家族のLINE連携ページ /link 用のLIFF ID）
# wrangler secret put LINE_ADD_FRIEND_URL    （連携ページで友だち追加を案内するURL。任意）
